<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>高校入試リスニング・トレーニング</title><style>body{font-family:system-ui,sans-serif;background:#f4f6fa;color:#172338;margin:0}main{max-width:760px;margin:30px auto;padding:22px;background:white;border-radius:18px;box-shadow:0 4px 25px #17233813}h1{font-size:1.55rem}h2{font-size:1.1rem}button,input,select{font:inherit;padding:10px;border-radius:9px;border:1px solid #aab4c3}button{background:#164d92;color:white;border:0;cursor:pointer}button:disabled{background:#9ba7b8}label{display:block;margin:10px 0}.muted{color:#53657b}.panel{background:#edf3fa;padding:16px;border-radius:12px;margin:18px 0}.question{border-top:1px solid #d9e0e9;padding:15px 0}.choice{display:block;padding:8px;margin:5px 0;border:1px solid #e2e6eb;border-radius:8px}.choice input{margin-right:10px}.hidden{display:none}.good{color:#14683a}.bad{color:#a22828}pre{white-space:pre-wrap;line-height:1.8;background:#f5f7fa;padding:14px;border-radius:9px}.pill{font-size:.85rem;color:#42546a}#status{min-height:1.5em}footer{font-size:.85rem;color:#53657b;margin-top:30px}</style></head><body><main><h1>🎧 高校入試リスニング・トレーニング</h1><p class="muted">中学3年生・発展編｜科学博物館への訪問計画｜5問</p><section id="setup" class="panel"><h2>はじめる前に</h2><label>生徒番号（氏名ではなく先生から指定された番号）<input id="student" placeholder="例：A023" maxlength="30" autocomplete="off"></label><label>モード<select id="mode"><option value="test">授業用テスト（再生2回）</option><option value="practice">家庭学習（何度でも再生）</option></select></label><p class="pill">授業用は同じブラウザでの再挑戦を制限します。ただし端末やブラウザを変えた場合など、厳密な試験制御はできません。</p><button id="start">開始する</button></section><section id="exam" class="hidden"><div class="panel"><h2>会話を聞く</h2><p id="plays"></p><label id="speedwrap" class="hidden">読み上げ速度 <select id="speed"><option value="0.8">ゆっくり</option><option value="0.95" selected>標準</option><option value="1.1">速め</option></select></label><button id="play">▶ 音声を再生</button> <button id="stop" style="background:#566579">■ 停止</button><p id="voicehint" class="pill">端末の英語音声読み上げ機能を使用します。音声が出ない場合はChromeやEdgeで試してください。</p></div><div id="questions"></div><button id="submit">解答を提出して採点</button><p id="status" role="status"></p></section><section id="result" class="hidden"><h2 id="score"></h2><p id="syncstatus" role="status"></p><div id="review"></div><h2>会話スクリプト</h2><pre id="transcript"></pre><button id="retry" class="hidden">もう一度練習する</button></section><footer>※試作品です。採点結果は設定済みのGoogle Apps Scriptへ送信します。送信後、先生がスプレッドシートで記録を確認してください。端末内にも結果を保存します。</footer></main><script>
// 先生がデプロイした Apps Script のウェブアプリURLをここに設定してください。
const RESULTS_ENDPOINT = 'https://script.google.com/macros/s/AKfycbxeNZjGzO7FysiTSKfOOkIeSRTe9cUuZDL4BpQa7EfeYlOcZ2M-CJunbPV_AvJ7ZpNKzQ/exec';
const dialog=[['Emma','Are you still planning to visit the science museum on Saturday, Ken?'],['Ken','I was, but my sister has a basketball game that day. So we are going on Sunday instead.'],['Emma','I see. The museum opens at nine thirty, right?'],['Ken','Usually, yes. But on Sundays, it opens at ten. Let us meet at the station at nine fifteen. The train takes about thirty minutes.'],['Emma','That sounds good. How much is the ticket?'],['Ken','It is eight hundred yen for adults, but students under fifteen can enter for five hundred yen.'],['Emma','Great! I want to see the space exhibition.'],['Ken','Me too. But we need to reserve a place online for that exhibition. I already booked two places yesterday.'],['Emma','Thanks! Can we take pictures inside?'],['Ken','We can take pictures in most rooms, but not in the space exhibition.'],['Emma','Then I will leave my camera at home.'],['Ken','You can still bring it. There are other interesting rooms where pictures are allowed.']];
const qs=[{q:'2人が博物館へ行くのはいつですか。',a:['On Friday.','On Saturday.','On Sunday.','On Monday.'],correct:2,why:'Kenの妹の試合が土曜日にあるため、訪問日を日曜日に変更しています。最初の予定と変更後の予定を区別しましょう。'},{q:'日曜日の博物館の開館時刻は何時ですか。',a:['9:00 a.m.','9:15 a.m.','9:30 a.m.','10:00 a.m.'],correct:3,why:'通常は9時30分ですが、日曜日は10時開館です。9時15分は駅での待ち合わせ時刻です。'},{q:'14歳の生徒1人の入館料はいくらですか。',a:['300 yen.','500 yen.','800 yen.','1,000 yen.'],correct:1,why:'15歳未満の生徒は500円です。800円は大人の料金です。'},{q:'宇宙展について、会話から正しいと分かるものはどれですか。',a:['Ken has already made reservations for two people.','Emma must buy tickets at the station.','The exhibition is closed on Sundays.','They can take photos in the exhibition.'],correct:0,why:'Kenは昨日2人分をオンライン予約しました。宇宙展では写真撮影が禁止されています。'},{q:'最後のKenの発言の意図として最も適切なものはどれですか。',a:['To ask Emma to buy a new camera.','To explain that cameras are not allowed anywhere.','To tell Emma she can use her camera in other rooms.','To suggest visiting the museum alone.'],correct:2,why:'宇宙展以外には写真撮影が認められる部屋があるため、カメラを家に置いてくる必要はないと説明しています。'}];
const $=id=>document.getElementById(id);let mode='',student='',playCount=0,submitted=false,active=false,utterances=[];const key=()=>`listening-v2-test-${student.toLowerCase()}`;
$('questions').innerHTML=qs.map((x,i)=>`<div class="question"><h2>問${i+1}　${x.q}</h2>${x.a.map((v,j)=>`<label class="choice"><input type="radio" name="q${i}" value="${j}">${'ABCD'[j]}. ${v}</label>`).join('')}</div>`).join('');
function count(){ $('plays').textContent=mode==='test'?`再生回数：${playCount} / 2`:`再生回数：${playCount}（制限なし）`; $('play').disabled=submitted||(mode==='test'&&playCount>=2)||active; }
function stop(){speechSynthesis.cancel();active=false;count()}
function speakLine(i){if(!active)return;if(i>=dialog.length){active=false;count();return}const [who,line]=dialog[i];let u=new SpeechSynthesisUtterance(line);u.lang='en-US';u.rate=mode==='test'?.95:Number($('speed').value);u.pitch=who==='Emma'?1.18:.88;u.onend=()=>speakLine(i+1);u.onerror=()=>{active=false;count();$('voicehint').textContent='音声を再生できませんでした。端末の音声設定をご確認ください。'};speechSynthesis.speak(u)}
$('start').onclick=()=>{student=$('student').value.trim();if(!/^[a-zA-Z0-9_-]{2,30}$/.test(student)){alert('生徒番号は英数字・ハイフン・アンダースコアで2～30文字にしてください。');return}mode=$('mode').value;if(mode==='test'&&localStorage.getItem(key())){alert('この端末では、この生徒番号でのテスト提出がすでに記録されています。先生に相談してください。');return}$('setup').classList.add('hidden');$('exam').classList.remove('hidden');$('speedwrap').classList.toggle('hidden',mode==='test');count()};
$('play').onclick=()=>{if(active||submitted||(mode==='test'&&playCount>=2))return;if(!('speechSynthesis'in window)){alert('このブラウザは音声読み上げに対応していません。');return}playCount++;active=true;count();speechSynthesis.cancel();speakLine(0)};$('stop').onclick=stop;
$('submit').onclick=async()=>{let answers=qs.map((_,i)=>document.querySelector(`input[name=q${i}]:checked`)?.value);if(answers.some(x=>x===undefined)){alert('すべての問題に解答してください。');return}if(!confirm('解答を提出しますか？'))return;stop();submitted=true;count();$('submit').disabled=true;document.querySelectorAll('input[type=radio]').forEach(e=>e.disabled=true);let score=answers.reduce((n,a,i)=>n+(Number(a)===qs[i].correct),0);let record={student_id:student,mode,score,total:qs.length,answers:answers.map(Number),correct_answers:qs.map(q=>q.correct),play_count:playCount,submitted_at:new Date().toISOString(),quiz_id:'science-museum-v2'};if(mode==='test')localStorage.setItem(key(),JSON.stringify(record));let saved=JSON.parse(localStorage.getItem('listening-v2-records')||'[]');saved.push(record);localStorage.setItem('listening-v2-records',JSON.stringify(saved));$('exam').classList.add('hidden');$('result').classList.remove('hidden');$('score').textContent=`結果：${score} / ${qs.length} 点`;$('review').innerHTML=qs.map((q,i)=>`<div class="question"><strong class="${Number(answers[i])===q.correct?'good':'bad'}">問${i+1}：${Number(answers[i])===q.correct?'正解':'不正解'}</strong><p>あなたの解答：${'ABCD'[Number(answers[i])]} ／ 正解：${'ABCD'[q.correct]}</p><p>${q.why}</p></div>`).join('');$('transcript').textContent=dialog.map(([who,line])=>`${who}: ${line}`).join('\n\n');if(mode==='practice')$('retry').classList.remove('hidden');if(!RESULTS_ENDPOINT){$('syncstatus').textContent='結果はこの端末に保存されました。先生への送信は未設定です。';return}try{await fetch(RESULTS_ENDPOINT,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(record)});$('syncstatus').textContent='結果を送信しました（サーバー側の保存確認はできません）。';}catch(e){$('syncstatus').textContent='送信できませんでした。結果は端末内に保存されています。先生に連絡してください。';}};
$('retry').onclick=()=>{stop();submitted=false;playCount=0;document.querySelectorAll('input[type=radio]').forEach(e=>{e.checked=false;e.disabled=false});$('submit').disabled=false;$('result').classList.add('hidden');$('exam').classList.remove('hidden');count()};
</script></body></html>
